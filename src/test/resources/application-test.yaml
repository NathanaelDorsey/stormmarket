spring:
  datasource:
    url: jdbc:h2:mem:stormmarket_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:jwt/public-key.pem
  sql:
    init:
      mode: always

stormmarket:
  jwt:
    private-key-location: classpath:jwt/private-key.pem
    public-key-location: classpath:jwt/public-key.pem

h2:
  console:
    enabled: true
    path: /h2-console
    settings:
      web-allow-others: true
