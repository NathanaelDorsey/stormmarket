name: Greptile AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: greptile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  greptile-review:
    name: Greptile AI Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Greptile CLI
        run: npm install -g greptile@latest

      - name: Login to Greptile
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
        run: |
          if [ -n "$GREPTILE_API_KEY" ]; then
            greptile login --api-key "$GREPTILE_API_KEY"
          else
            echo "GREPTILE_API_KEY not set, skipping login (will use public access)"
          fi

      - name: Run Greptile Review
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Running Greptile review on PR #${{ github.event.pull_request.number }}"
          if ! greptile review -b main --json > greptile-report.json; then
            echo "Greptile review command failed" > greptile-report.txt
            echo "GREPTILE_FAILED=true" >> $GITHUB_ENV
          else
            echo "GREPTILE_FAILED=false" >> $GITHUB_ENV
          fi
          
          if [ -f greptile-report.json ]; then
            echo "Greptile review completed"
            cat greptile-report.json | jq -r '.findings[] | "\(.severity): \(.title) - \(.file):\(.line)"' || true
          else
            echo "No Greptile report generated"
          fi

      - name: Post Greptile Review as PR Comment
        if: always() && github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'greptile-report.json';
            
            if (!fs.existsSync(reportPath)) {
              console.log('No Greptile report found');
              return;
            }
            
            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (e) {
              console.log('Failed to parse Greptile report: ' + e.message);
              await github.rest.issues.createComment({
                issue_number: ${{ github.event.pull_request.number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ⚠️ Greptile AI Review

Failed to parse Greptile report. The review may have encountered an error. Check workflow logs for details.'
              });
              return;
            }
            
            if (!report.findings || report.findings.length === 0) {
              await github.rest.issues.createComment({
                issue_number: ${{ github.event.pull_request.number }},
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## ✅ Greptile AI Review\n\nNo issues found. Great job!'
              });
              return;
            }
            
            const severityOrder = { 'critical': 0, 'major': 1, 'minor': 2, 'info': 3 };
            const sortedFindings = [...report.findings].sort((a, b) => 
              (severityOrder[a.severity] ?? 99) - (severityOrder[b.severity] ?? 99)
            );
            
            let body = '## 🤖 Greptile AI Code Review\n\n';
            body += `| Severity | File | Line | Issue |\n`;
            body += `|----------|------|------|-------|\n`;
            
            for (const finding of sortedFindings.slice(0, 50)) {
              const severityEmoji = {
                'critical': '🔴',
                'major': '🟠',
                'minor': '🟡',
                'info': '🔵'
              }[finding.severity] || '⚪';
              
              body += `| ${severityEmoji} ${finding.severity} | \`${finding.file}\` | ${finding.line || 'N/A'} | ${finding.title} |\n`;
            }
            
            if (report.findings.length > 50) {
              body += `\n... and ${report.findings.length - 50} more findings.`;
            }
            
            body += `\n\n*Reviewed against \`main\` branch. [View full report](${report.url || 'N/A'})*`;
            
            await github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });