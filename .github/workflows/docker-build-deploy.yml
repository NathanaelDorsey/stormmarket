name: Build and Deploy Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Copy test JWT keys to main resources
        run: |
          mkdir -p src/main/resources/jwt
          cp src/test/resources/jwt/* src/main/resources/jwt/

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B

      - name: Run Tests
        run: ./mvnw test -Dspring.profiles.active=test

      - name: Run Verify (SpotBugs, JaCoCo, FindSecBugs)
        run: ./mvnw verify -Dspring.profiles.active=test

      - name: Run Spotless Check
        run: ./mvnw spotless:check -Dspring.profiles.active=test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request' && github.repository_owner == 'NathanaelDorsey'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.repository_default_branch == github.ref_name }}

      - name: Build and push Docker image
        id: build
        if: github.event_name != 'pull_request' && github.repository_owner == 'NathanaelDorsey'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.ref_name }}

      - name: Build Docker image locally (for PR testing)
        if: github.event_name == 'pull_request' || github.repository_owner != 'NathanaelDorsey'
        run: |
          docker build --load -t stormmarket:test .

      - name: Upload Docker image digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-digest
          path: |
            /tmp/digest.txt

  # Test the built Docker image by running container and executing Postman tests
  test-docker-image:
    name: Test Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository_owner == 'NathanaelDorsey'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy test JWT keys to main resources
        run: |
          mkdir -p src/main/resources/jwt
          cp src/test/resources/jwt/* src/main/resources/jwt/

      # Create a shared network for containers to communicate
      - name: Create Docker network
        run: docker network create stormmarket-network

      - name: Start MySQL container
        run: |
          docker run -d --name mysql-test \
            --network stormmarket-network \
            --network-alias mysql \
            -e MYSQL_DATABASE=stormmarket \
            -e MYSQL_USER=stormmarket \
            -e MYSQL_PASSWORD=StormMarketPass! \
            -e MYSQL_ROOT_PASSWORD=RootPass! \
            -e MYSQL_TCP_PORT=3306 \
            mysql:8.0 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --max-allowed-packet=64M

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..60}; do
            if docker exec mysql-test mysqladmin ping -h 127.0.0.1 -u stormmarket -pStormMarketPass! > /dev/null 2>&1; then
              echo "MySQL is ready!"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/60)"
            sleep 2
          done
          echo "MySQL failed to start"
          docker logs mysql-test
          exit 1

      - name: Generate test JWT keys
        run: |
          mkdir -p /tmp/jwt
          openssl genrsa -out /tmp/jwt/private-key.pem 2048
          openssl rsa -in /tmp/jwt/private-key.pem -pubout -out /tmp/jwt/public-key.pem

      - name: Start Storm Market container
        run: |
          docker run -d --name stormmarket-test \
            -p 8081:8080 \
            --network stormmarket-network \
            -e SPRING_PROFILES_ACTIVE=production \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/stormmarket \
            -e SPRING_DATASOURCE_USERNAME=stormmarket \
            -e SPRING_DATASOURCE_PASSWORD=StormMarketPass! \
            -e SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_PUBLIC-KEY-LOCATION=/tmp/jwt/public-key.pem \
            -e STORMMARKET_JWT_PRIVATE_KEY_LOCATION=/tmp/jwt/private-key.pem \
            stormmarket:test

      - name: Wait for Storm Market to be ready
        run: |
          echo "Waiting for Storm Market to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8081/v1/products > /dev/null 2>&1; then
              echo "Storm Market is ready!"
              exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 2
          done
          echo "Application failed to start"
          docker logs stormmarket-test
          exit 1

      - name: Create test admin user
        run: |
          ADMIN_RESPONSE=$(curl -s -X POST http://localhost:8081/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"docker_admin","email":"docker_admin@test.com","password":"DockerAdminPass123!","firstName":"Docker","lastName":"Admin"}')
          echo "Admin register: $ADMIN_RESPONSE"

      - name: Create test user
        run: |
          USER_RESPONSE=$(curl -s -X POST http://localhost:8081/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"docker_user","email":"docker_user@test.com","password":"DockerUserPass123!","firstName":"Docker","lastName":"User"}')
          echo "User register: $USER_RESPONSE"

      - name: Login as admin and extract token
        run: |
          ADMIN_LOGIN=$(curl -s -X POST http://localhost:8081/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"docker_admin","password":"DockerAdminPass123!"}')
          echo "ADMIN_TOKEN=$(echo "$ADMIN_LOGIN" | jq -r '.token')" >> $GITHUB_ENV

      - name: Login as user and extract token
        run: |
          USER_LOGIN=$(curl -s -X POST http://localhost:8081/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"docker_user","password":"DockerUserPass123!"}')
          echo "USER_TOKEN=$(echo "$USER_LOGIN" | jq -r '.token')" >> $GITHUB_ENV

      - name: Install Postman CLI
        run: |
          npm install -g @postman/cli

      - name: Run Postman Collection (Admin) - Docker
        run: |
          postman collection run "postman/collections/Storm Market API" \
            --global-var "baseUrl=http://localhost:8081" \
            --global-var "authToken=${ADMIN_TOKEN}" \
            --bail=false \
            --output docker-admin-results.json

      - name: Run Postman Collection (User) - Docker
        run: |
          postman collection run "postman/collections/Storm Market API" \
            --global-var "baseUrl=http://localhost:8081" \
            --global-var "authToken=${USER_TOKEN}" \
            --bail=false \
            --output docker-user-results.json

      - name: Upload Docker test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-postman-results
          path: |
            docker-admin-results.json
            docker-user-results.json

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-logs
          path: |
            docker logs stormmarket-test

      - name: Cleanup containers
        if: always()
        run: |
          docker stop stormmarket-test mysql-test 2>/dev/null || true
          docker rm stormmarket-test mysql-test 2>/dev/null || true
          docker network rm stormmarket-network 2>/dev/null || true

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ needs.build-and-test.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-test.outputs.image-digest }}"
          # Add your staging deployment commands here
          # Example: kubectl set image deployment/stormmarket stormmarket=${{ needs.build-and-test.outputs.image-tag }}

      - name: Run smoke tests against staging
        run: |
          echo "Running smoke tests against staging..."
          # Add staging smoke tests here

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ needs.build-and-test.outputs.image-tag }}"
          echo "Digest: ${{ needs.build-and-test.outputs.image-digest }}"
          # Add your production deployment commands here
          # Example: kubectl set image deployment/stormmarket stormmarket=${{ needs.build-and-test.outputs.image-tag }}

      - name: Run smoke tests against production
        run: |
          echo "Running smoke tests against production..."
          # Add production smoke tests here

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false