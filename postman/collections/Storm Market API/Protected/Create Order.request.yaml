$kind: http-request
id: d0ff96446cf97faf5b365db9
method: POST
url: "{{baseUrl}}/v1/orders"
description: Create a new order from the shopping cart. Requires authentication. Request body should include cart item selections, shipping address, and payment information.
body:
  type: json
  content: '{"shippingAddress":{"street":"123 Test St","city":"Testville","zipCode":"12345","country":"USA"},"paymentMethod":"credit_card"}'
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
scripts:
  - type: afterResponse
    code: |
      const code = pm.response.code;
      const hasBody = pm.response.text && pm.response.text().length > 0;
      const body = hasBody ? (pm.response.json ? pm.response.json() : {}) : {};
      
      if (code === 201) {
        pm.test("201 Created: Returns order object", function () { 
          pm.expect(body).to.have.property('order'); 
        });
        pm.test("201 Created: No ApiErrorResponse envelope", function () {
          pm.expect(body).to.not.have.property('timestamp');
          pm.expect(body).to.not.have.property('status');
          pm.expect(body).to.not.have.property('error');
        });
        pm.test("201 Created: Order has required fields", function () {
          pm.expect(body.order).to.have.property('id');
          pm.expect(body.order).to.have.property('total');
          pm.expect(body.order).to.have.property('status');
        });
      } else if ([400, 401, 403].includes(code)) {
        if (hasBody) {
          pm.test(code + " Error: Returns ApiErrorResponse envelope", function () {
            pm.expect(body).to.have.property('timestamp');
            pm.expect(body).to.have.property('status', code);
            pm.expect(body).to.have.property('error');
            pm.expect(body).to.have.property('message');
          });
          if (code === 400) {
            pm.test("400 Bad Request: Has validationErrors", function () {
              pm.expect(body).to.have.property('validationErrors');
            });
          }
        } else {
          pm.test(code + " Error: Empty response body (no auth token)", function () {
            pm.expect(pm.response.text()).to.be.empty;
          });
        }
      } else if (code === 500) {
        if (hasBody) {
          pm.test("500 Server Error: Returns ApiErrorResponse envelope", function () {
            pm.expect(body).to.have.property('timestamp');
            pm.expect(body).to.have.property('status', 500);
            pm.expect(body).to.have.property('error');
            pm.expect(body).to.have.property('message');
          });
        } else {
          pm.test("500 Server Error: Empty response body", function () {
            pm.expect(pm.response.text()).to.be.empty;
          });
        }
      } else {
        pm.test("Response received with status " + code, function () {
          pm.expect(code).to.be.a('number');
        });
      }
      
      pm.test("Content-Type is JSON (when body present)", function () {
        if (hasBody) {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
        }
      });
      pm.test("Response time is reasonable", function () {
        pm.expect(pm.response.responseTime).to.be.lessThan(5000);
      });
    language: text/javascript