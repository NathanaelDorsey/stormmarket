$kind: http-request
id: 3cf950d619a7aee819a52da3
name: Get Product Detail
method: GET
url: "{{baseUrl}}/v1/products/1"
description: Public product detail retrieval by ID. Tests API contract for all possible responses.
scripts:
  - type: afterResponse
    code: |
      const code = pm.response.code;
      const body = pm.response.json ? pm.response.json() : {};
      
      // Contract validation: validate response structure for each possible status
      if (code === 200) {
        // Success: should return product object without error envelope
        pm.test("200 OK: Returns product object", function () { 
          pm.expect(body).to.have.property('product'); 
        });
        pm.test("200 OK: No ApiErrorResponse envelope on success", function () {
          pm.expect(body).to.not.have.property('timestamp');
          pm.expect(body).to.not.have.property('status');
          pm.expect(body).to.not.have.property('error');
        });
        pm.test("200 OK: Product has required fields", function () {
          pm.expect(body.product).to.have.property('id');
          pm.expect(body.product).to.have.property('name');
        });
      } else if (code === 404) {
        // Not found: should return proper ApiErrorResponse
        pm.test("404 Not Found: Returns ApiErrorResponse envelope", function () {
          pm.expect(body).to.have.property('timestamp');
          pm.expect(body).to.have.property('status', 404);
          pm.expect(body).to.have.property('error');
          pm.expect(body).to.have.property('message');
          pm.expect(body).to.have.property('path');
        });
        pm.test("404: Message describes the missing resource", function () {
          pm.expect(body.message).to.be.a('string').and.not.be.empty;
        });
      } else if (code === 500) {
        // Server error: should return proper ApiErrorResponse
        pm.test("500 Server Error: Returns ApiErrorResponse envelope", function () {
          pm.expect(body).to.have.property('timestamp');
          pm.expect(body).to.have.property('status', 500);
          pm.expect(body).to.have.property('error');
          pm.expect(body).to.have.property('message');
        });
      } else {
        // Any other status: validate it's a number and we got a response
        pm.test("Response received with status " + code, function () {
          pm.expect(code).to.be.a('number');
        });
      }
      
      // Universal contract checks
      pm.test("Content-Type is JSON", function () {
        pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
      });
      pm.test("Response time is reasonable", function () {
        pm.expect(pm.response.responseTime).to.be.lessThan(5000);
      });
    language: text/javascript