terms:
  API: "Application Programming Interface — a set of defined request/response contracts for client-server communication."
  DTO: "Data Transfer Object — a class/record defining the shape of request or response data, separate from internal entity models."
  JPA: "Java Persistence API — a specification for managing relational data in Java applications."
  Flyway: "A database migration tool for versioned SQL schema changes."
  JWT: "JSON Web Token — a compact, URL-safe token representation used for authentication and authorization."
  RS256: "RSA Signature with SHA-256 — the signing algorithm used for JWT tokens."
  Argon2: "A password hashing function that won the Password Hashing Competition (2015)."
  Pageable: "Spring Data abstraction for paginated, sorted data retrieval, exposing `page`, `size`, and `sort` parameters."
  ROLE_: "A prefixed authority name in Spring Security, e.g., ROLE_USER, ROLE_ADMIN, indicating granted permissions."
  REST: "Representational State Transfer — an architectural style for distributed systems using HTTP methods and resources."
  DTO Record: "An immutable data carrier class/record used for request/response mapping, often with `@RequiredArgsConstructor` (Lombok)."
  Entity: "A JPA `@Entity` class mapped to a database table, representing the persistent model."
  Service Layer: "The business-logic layer (`@Service`) that orchestrates repositories, applies validation, and ensures transactional integrity."
  Exception Handler: "A `@RestControllerAdvice` that centralizes exception mapping to HTTP status codes and consistent `ApiErrorResponse` records."
  ApiErrorResponse: "A standardized error envelope record: `{ timestamp, status, error, message, path, validationErrors }`."
  PermitList: "A Spring Security feature that explicitly lists which routes are permitted without full authentication checks."
  CSRF: "Cross-Site Request Forgery — a security vulnerability; disabled per design in Storm Market for API-only usage."
  Testcontainers: "A library for running disposable Docker containers in JVM tests (MySQL, PostgreSQL, etc.)."
  Integration Test: "A test that uses a real database (via Testcontainers), opt-in via `-Drun.mysql.integration=true`."
  Unit Test: "A test using an in-memory database (H2 by default), run via `./mvnw test`."
  Property-based Test: "A test generated with jqwik that exercises a property across many random inputs, rather than fixed cases."
  SpotBugs: "A static analysis tool for detecting bugs in Java code."
  FindSecBugs: "A security-focused static analysis tool for Java, often bundled with SpotBugs."
  JaCoCo: "A code coverage library for Java, reporting percentages of statement, branch, and line coverage."
  Spotless: "A code formatting plugin for Maven (Palantir Java Format), currently configured with `<skip>true</skip>` in CI."