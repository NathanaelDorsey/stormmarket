core_value: "Adopt Result<T,E> pattern across core domain services to make expected failures explicit at compile time, eliminating exception-based control flow for business rule violations."

summary: |
  StormMarket currently uses inconsistent error handling: ProductRepository stock methods return int (0=failure), CartService/OrderService/PaymentService throw IllegalArgumentException/IllegalStateException for expected business rule violations (insufficient stock, invalid state transitions, ownership checks). This forces callers to use try/catch for control flow, makes error handling inconsistent across services, and prevents the compiler from enforcing handling of expected failures.

  This initiative adopts the existing Result<T,E> sealed interface (Ok/Err) — already used for coupon validation — across four core services: ProductRepository (stock operations), CartService (cart mutations), OrderService (order transitions), and PaymentService (payment lifecycle). Each service gets a dedicated error type (StockError, CartError, OrderError, PaymentError) extending a common DomainError base. Controllers delegate to a new ResultHttpMapper for centralized error→HTTP mapping. Transaction rollback on Err is handled via explicit setRollbackOnly(). Error instances are static singletons for zero-allocation hot paths.

in_scope:
  - "product-stock-result: ProductRepository stock methods (reserveStock, deductStock, captureStock, restoreStock, releaseReservedStock) return Result<Integer, StockError>"
  - "cart-result: CartService mutations (addProduct, updateQuantity, removeProduct, clearCart, applyCoupon, removeCoupon) return Result<Void, CartError>"
  - "order-result: OrderService transitions (placeOrder, completeOrderWithPayment, cancelOrderWithRefund, updateOrderStatus) return Result<OrderResponse, OrderError>"
  - "payment-result: PaymentService lifecycle (authorizePayment, capturePayment, refundPayment, failPayment) return Result<Payment, PaymentError>"
  - "domain-error-hierarchy: DomainError base class + StockError, CartError, OrderError, PaymentError as static singleton error constants"
  - "result-http-mapper: ResultHttpMapper component for centralized error→HTTP status/body mapping"
  - "controller-delegation: Controllers updated to call mapper.toResponse(result) instead of try/catch"
  - "transaction-rollback: @Transactional methods call setRollbackOnly() on Err to preserve rollback semantics"
  - "test-updates: All 175 tests updated to expect Result instead of exceptions"

out_of_scope:
  - "global-exception-handler: GlobalExceptionHandler unchanged — still catches unexpected exceptions (NPE, DB down)"
  - "repository-finders: findById, findAll, etc. keep Optional/null returns"
  - "migration-scripts: No schema changes required"
  - "testcontainers-integration: MySQL integration tests behavior unchanged"
  - "new-dependencies: Zero new dependencies added"
  - "api-contracts: HTTP request/response bodies unchanged — only internal error handling style changes"

constraints:
  - "Result<E extends Throwable> bound requires error types to extend Throwable → DomainError extends RuntimeException"
  - "Must not break existing API contracts — controllers return identical HTTP responses"
  - "Must preserve transaction boundaries — rollback on expected failures must still work via setRollbackOnly()"
  - "Must maintain same test behavior — 175 tests pass with updated assertions"
  - "No new dependencies — only existing Result, Ok, Err in common.exception"
  - "Performance: Result allocation on hot paths (cart add, stock check) must be negligible — static error singletons"

success_criteria:
  - "All 175 tests pass with updated assertions for Result pattern"
  - "SpotBugs: 0 bugs, 0 errors; FindSecBugs: 0 issues"
  - "JaCoCo coverage maintained (64% instruction / 51% branch / 51% line / 62% method / 85% class)"
  - "Spotless compliant (Palantir Java Format)"
  - "Postman collection: 21 requests, 67 assertions, 0 failures"
  - "No regression in HTTP response codes or bodies for any endpoint"
  - "Transaction rollback verified on Err paths via integration tests"

references:
  - "specs/planning-context.yaml"
  - "specs/product/VISION_LATEST.yaml"
  - "src/main/java/com/nathanaeldorsey/stormmarket/common/exception/Result.java"
  - "src/main/java/com/nathanaeldorsey/stormmarket/product/CouponService.java (existing Result usage)"

trade_off_analysis:
  - item: "GlobalExceptionHandler for expected failures"
    excluded_because: "Would keep exception-based control flow; ResultHttpMapper centralizes mapping once"
  - item: "Controller-level error handling without mapper"
    excluded_because: "Duplicates HTTP mapping logic across 8+ controllers; violates DRY"
  - item: "Throwing exceptions on Err for automatic rollback"
    excluded_because: "Loses explicit Result handling; setRollbackOnly() preserves declarative @Transactional"
  - item: "Instance-per-error (new StockError() each time)"
    excluded_because: "Unnecessary allocation on hot paths; static singletons are thread-safe and idiomatic"
  - item: "Separate error hierarchy per service (no common base)"
    excluded_because: "Mapper would need 4+ catch blocks; DomainError enables single exhaustive switch"